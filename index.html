<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CryptoForge</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0f1a; color: #dfe6f3; font-family: system-ui, sans-serif; overflow: hidden; }
  #game { position: fixed; inset: 0; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud header { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; gap: 10px; align-items: center; padding: 0 14px; background: linear-gradient(#0b0f1af0, #0b0f1a00); pointer-events: auto; }
  .stat { background: #131a2add; border: 1px solid #232d45; border-radius: 10px; padding: 6px 10px; font-size: 12px; color: #8b97b3; min-width: 92px; }
  .stat b { display: block; font-size: 15px; color: #e8eefc; white-space: nowrap; }
  .stat.chart { min-width: 0; padding: 4px 6px; }
  .neg { color: #ff6a3d !important; }
  header #reset { margin-left: auto; }
  #panel { position: absolute; top: 76px; right: 12px; bottom: 100px; width: 320px; background: #121829f2; border: 1px solid #232d45; border-radius: 14px; display: flex; flex-direction: column; pointer-events: auto; overflow: hidden; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid #232d45; }
  #content { overflow: auto; padding: 10px; flex: 1; }
  .card { background: #1a2238; border: 1px solid #2a3554; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .card.done { border-color: #4fd1c5; }
  .card.lock { opacity: .55; }
  .card.cur { border-color: #ffc857; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: #8b97b3; font-size: 12px; }
  .tag { font-size: 11px; color: #8b97b3; border: 1px solid #3a4a7a; border-radius: 6px; padding: 1px 6px; }
  button { background: #23305a; color: #e8eefc; border: 1px solid #3a4a7a; border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.on { background: #4fd1c5; color: #0b0f1a; border-color: #4fd1c5; }
  #footer { position: absolute; left: 12px; right: 340px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  #rooms { display: flex; gap: 6px; flex-wrap: wrap; }
  #footer .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #121829f2; border: 1px solid #232d45; border-radius: 12px; padding: 8px 10px; font-size: 13px; }
  .grow { flex: 1; }
  #toasts { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .toast { background: #4fd1c5; color: #0b0f1a; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; white-space: nowrap; }
  @media (max-width: 699px) {
    header { flex-wrap: wrap; height: auto; padding: 6px; gap: 6px; }
    .stat { min-width: 0; flex: 1 1 28%; }
    #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 110px; height: 40vh; }
    #footer { left: 8px; right: 8px; bottom: 8px; }
    #toasts { top: 120px; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <header>
    <div class="stat"><span>Bargeld</span><b id="cash">–</b></div>
    <div class="stat"><span>BIT</span><b id="coins">–</b></div>
    <div class="stat"><span>Kurs</span><b id="price">–</b></div>
    <div class="stat chart"><canvas id="spark" width="120" height="30"></canvas></div>
    <div class="stat"><span>Hashrate</span><b id="hash">–</b></div>
    <div class="stat"><span>Netto</span><b id="net">–</b></div>
    <button id="reset">Reset</button>
  </header>
  <aside id="panel"><nav id="tabs"></nav><div id="content"></div></aside>
  <footer id="footer">
    <div id="rooms"></div>
    <div class="bar">
      <span id="roomInfo"></span><span class="grow"></span>
      <button data-act="sell" data-f="0.5">50 % verkaufen</button>
      <button data-act="sell" data-f="1">Alles verkaufen</button>
    </div>
  </footer>
  <div id="toasts"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
